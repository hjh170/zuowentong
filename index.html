.chip.sm{font-size:15px;padding:8px 12px;min-height:40px}
</style>

"拟人":"把物当作人来写，让它有人的动作、语言或感情。",
"排比":"三个或三个以上结构相似的短语或句子连在一起。",
"夸张":"故意把事物说得特别大、特别小或特别强，用来突出特点。",
"反问":"用疑问的形式表达肯定的意思，不需要回答。",
"设问":"自己提出问题，自己回答，用来引起注意、引出下文。",

const ESSAYS=[{"t":"我的妈妈","k":"写人","ps":["我的妈妈个子不高，头发短短的，笑起来有一颗小虎牙。她走路很快，说话也很快，像一阵风。","每天早上，她一边给我梳头，一边说：“今天要开心。”她的手指在我头上一梳一梳，很轻，像小雨点落在头发上。","有一次我发烧，半夜醒来，看见她坐在床边的小凳上，眼睛红红的。她摸摸我的额头，说：“退了，退了。”","我喜欢妈妈，因为她的手会梳头，也会在我害怕的时候，一直握着我的手。"],"n":["没有一句“我爱妈妈”，却句句都在说爱。手指“像小雨点”，是自己看见的比喻。","写人先写一个动作，再写这个动作给人的感觉。"]},{"t":"我的好朋友","k":"写人","ps":["我的好朋友叫朵朵，她比我矮半个头，扎两个小辫子，一跑起来辫子就在后面蹦。","我们最爱玩“石头剪刀布”。她每次都先出石头，我就出布，她输了不服气，说：“再来一次，再来一次。”","上星期我忘带橡皮，她把她的橡皮掰成两半，一半给我。她说：“这样我们就有一样的橡皮了。”","我把那半块橡皮放在铅笔盒最上面，一直舍不得用。"],"n":["一件小事就把“好朋友”写明白了，掰橡皮这个动作比十句“我们很好”都有力。","写朋友，只挑一件他为你做的小事。"]},{"t":"下雨了","k":"写景","ps":["下雨了。","雨点先是一滴两滴，落在窗台上，啪啪地响。后来就下大了，哗哗哗，像有人在楼上倒豆子。","我趴在窗边看，路上的伞像一朵朵小花，慢慢地移过去。屋檐下挂了一排水珠，一颗掉下来，又长出一颗。","妈妈喊我别站太近，会淋湿。我说：“我不是淋湿，我是在看雨。”"],"n":["有声音（啪啪、哗哗），有比喻（倒豆子、小花），最后一句还有一点小机灵。","写雨这类景，把耳朵也用上——“听见了什么”往往比“看见了什么”更好写。"]},{"t":"球球","k":"写动物","ps":["我家有一只小狗，叫球球。它全身是黄的，只有四只脚是白的，像穿了袜子。","我一回家，它就从沙发后面冲出来，绕着我的腿转圈，尾巴甩得像小风扇，把拖鞋都扫歪了。","它最爱吃西瓜。我把西瓜皮放在地上，它先闻一闻，再用舌头舔，舔得满脸都是。","有一次它舔得太认真，整张脸埋进西瓜皮里，抬起头来时，鼻子上还挂着一粒黑瓜子。"],"n":["全身写黄、脚写白，“像穿了袜子”，一句话就把小狗记住了；最后那个黑瓜子是全文最好笑的一笔。","写动物，一定给它留一个“出丑”的瞬间。"]},{"t":"春天来了","k":"写景","ps":["春天来了。","柳树的芽先冒出来，是浅绿色的，小小的，一串一串，像刚洗过的小铃铛。风一吹，它们就在枝头上晃。","小草从土里钻出来，有的直着身子，有的弯着腰，还有的只露出一点点尖。","我在花坛边蹲了很久，看见一只小蚂蚁从草叶下爬出来，绕着一块饼干渣转了三圈，才把它举起来，慢慢走回家。"],"n":["不写“春天很美”，只写芽、草、蚂蚁各自在做什么，画面自己就出来了。","写春天，选三个很小的东西各写一句，不要写一大片。"]},{"t":"第一次洗碗","k":"写事","ps":["晚饭后，我说：“今天我洗碗。”","我把碗放进水池，挤了一点洗洁精。泡沫越来越多，像小雪山。我拿抹布擦碗，碗变得滑滑的，抓不住，“咚”的一声掉进水里，水花溅到我的衣服上。","妈妈在旁边看着，笑了，说：“不要紧，慢一点。”","最后我把碗一个个放在架子上，摆得整整齐齐。爸爸走过来看了看，说：“真亮。”我心里也亮亮的。"],"n":["中间那声“咚”就是波折，摔了碗才像真的第一次。结尾“心里也亮亮的”借了爸爸的“亮”，很聪明。","写第一次做一件事，一定要安排一个小意外。"]},{"t":"放风筝","k":"写事","ps":["星期天，爸爸带我去公园放风筝。","风筝是一只大蝴蝶，翅膀上有黑色的圆点。爸爸拿着线跑了几步，风一来，风筝就往上飞，越飞越高，飞到树顶上，只剩一个小点。","忽然风小了，风筝摇摇晃晃往下掉。我着急地喊：“快跑！”爸爸就跑，线在他手里一松一紧。风筝慢慢又升起来。","我仰着头看，脖子都酸了，可还是舍不得低头。"],"n":["有升、有落、又升起来，一条线走完一个故事；最后“脖子酸了”比“我很开心”更真实。","写事要写出“先怎样、后来怎样、最后怎样”。"]},{"t":"爷爷的菜园","k":"写景","ps":["爷爷在屋后有一小块菜园。","他每天早上都去，手里拿一把小锄头，头上戴一顶草帽。菜园里有青椒、番茄，还有一排排小葱，绿得像用尺子画过一样直。","有一棵番茄长得比我高，爷爷给它插了一根棍子，用布条绑住。他说：“它会爬，要扶着。”","我最喜欢摘小番茄，洗完放进嘴里，一咬，酸得我眯起眼睛，可是过一会儿又想再吃一个。"],"n":["小葱“像用尺子画过一样直”，是真正的观察；爷爷那句“要扶着”，一句话写出了一个疼菜的人。","写景里放一个人、一句话，景就活了。"]},{"t":"我的铅笔盒","k":"状物","ps":["我有一个蓝色的铅笔盒，上面画着一只小恐龙。","铅笔盒分两层。上层放铅笔和橡皮，下层放尺子。橡皮是白色的，用久了会变小，边角上有一个小缺口，那是我擦错字擦出来的。","铅笔盒的拉链不太好了，每次拉都要轻轻歪一下才拉得动。我拉的时候会小声说：“乖一点，乖一点。”","它陪了我两年，还很结实。"],"n":["不写“我很喜欢它”，写“拉链要歪一下”“小声说乖一点”，喜欢就藏不住了。","写一样东西，去写它身上那个“用旧了的毛病”。"]},{"t":"小猫喝水","k":"写动物","ps":["楼下的小猫在喝水。","它先蹲下来，把头低下去，伸出粉红色的舌头，轻轻一勾，水就沾在舌头上。它喝一口，抬一下头，眼睛半闭着，喉咙里发出咕噜咕噜的声音。","喝完了，它抬起前爪，在脸上抹了抹，从眼睛抹到耳朵，抹了三四下，像在洗脸。","然后它抖了抖身子，慢悠悠地走开，尾巴竖得像一根小旗杆。"],"n":["一个“勾”字就写活了猫的舌头；动作一个接一个，像慢镜头。","写动物，把一个动作放慢，拆成四五下。"]},{"t":"下雪了","k":"写景","ps":["昨天夜里下雪了。","早上我一开窗，外面全白了。屋顶白，树白，连垃圾桶的盖子上也白了一层。雪还在轻轻飘，落在窗户上，一会儿就变成一颗小水珠。","我伸出手去接，雪落在手心里，凉凉的，像一根很轻的羽毛，还没看清就化了。","我和哥哥在楼下堆了一个雪人，用两颗黑豆做眼睛，用胡萝卜做鼻子。它没有嘴，可我觉得它在笑。"],"n":["“连垃圾桶的盖子上也白了一层”，这句把“全白了”写实了；结尾雪人没嘴却在笑，是孩子的眼睛。","写“全都白了”，就去找一个最不起眼的东西来举例。"]},{"t":"我给奶奶捶背","k":"写事","ps":["奶奶说她的背有点酸。","我让她坐在小椅子上，我站在她身后，两个拳头轻轻地捶。捶的时候有咚咚的声音，我觉得很好听。","奶奶说：“轻一点，轻一点。”我就把拳头放轻。她又说：“再往上一点。”我就往上面挪一点。","捶了一会儿，我的手有点酸了。奶奶回过头，笑着说：“好了，好了，舒服了。”","我高兴得在她的背上又轻轻拍了一下。"],"n":["奶奶两次“指挥”，我两次“照做”，一老一小就出来了；自己手酸这个细节也没有藏。","写对话就用原话，短句短句地写，别加工。"]},{"t":"运动会那天","k":"写事","ps":["学校开运动会。","我参加的是接力跑。我站在跑道上，心一直跳，跳得像有人在里面敲小鼓。","前面的同学跑过来了，把棒子递给我。我一把抓住就跑。风在耳边呼呼地响，我看见好多人在喊，可是听不清喊什么。","跑完我才知道，我们班得了第二名。我喘着气，说不出话，只对着同学一直点头。"],"n":["心跳“像有人在里面敲小鼓”，怕写得具体；“听不清喊什么”，是跑道上的真感觉。","写紧张的场面，只写身体的感觉，不写“我很紧张”。"]},{"t":"我的老师","k":"写人","ps":["我的语文老师姓王，她的头发总是盘在后面，用一个黑色的卡子卡住。","她讲课的时候会走来走去，讲到高兴的地方，眼睛就亮亮的，声音也变大。","有一次我写的字很乱，她没有批评我，只在本子上画了一个小太阳，旁边写：“慢一点，字会更好看。”","从那以后，我写字的时候，会想起那个小太阳。"],"n":["一个小太阳，既是老师的办法，也是全文的“结”；没有一句夸奖，老师就立起来了。","写老师，找一个只属于她的记号（发型、口头禅、一支笔）。"]},{"t":"秋天的树叶","k":"写景","ps":["秋天到了，树叶一片一片往下掉。","有的叶子是黄的，有的是红的，还有黄里带一点绿。它们落在地上，铺了薄薄一层，走上去有沙沙的声音。","我捡了一片最大的梧桐叶，比我的手还大。它的边上有尖尖的角，我举起来对着太阳，光就从叶子的缝隙里漏下来，一点一点的。","我把这片叶子夹在书里，想留到冬天再拿出来看。"],"n":["写了颜色、声音，还写了“举起来对着太阳”这个动作，一片叶子被看透了。","写一样东西，换三个角度：看、听、拿在手里。"]},{"t":"我学会了系鞋带","k":"写事","ps":["我一直不会系鞋带，鞋带松了就叫妈妈。","后来妈妈教我：先交叉，绕一个圈，把另一个头从中间穿过去，再拉紧。我学了好几次，第一次拉得太用力，整个结散了。","我坐在门口，一边念“交叉、绕圈、穿过去、拉一拉”，一边练。练了七八次，忽然就打好了。","那一下我特别高兴，站起来在客厅走了两圈，故意把鞋带露在外面给大家看。"],"n":["口诀一样的一串词是这篇的特色；“故意把鞋带露出来”把这个小得意写得人人都会心。","写“学会了”，一定要写出成功那一下之后的反应。"]},{"t":"过生日","k":"写事","ps":["昨天是我七岁的生日。","妈妈买了一个小蛋糕，上面插着七根蜡烛。灯关掉以后，蜡烛的光在妈妈脸上晃来晃去。","大家一起唱生日歌，我闭上眼睛许愿。我许的愿不能说，说了就不灵了。","吹蜡烛的时候，我一次没吹完，还剩两根。大家都笑，我也笑，又用力吹了一次，这回全灭了。"],"n":["“说了就不灵了”是孩子才有的逻辑；蜡烛没一次吹灭，比“我很幸福”更有意思。","写开心的事，留一个不太完美的小细节。"]},{"t":"我家的小阳台","k":"写景","ps":["我家的阳台很小，只站得下三四个人。","阳台上放了三盆花，一盆是吊兰，叶子软软地垂下来，快碰到地了。妈妈说它喝了很多水。","下雨的时候，雨点打在阳台的铁栏杆上，会唱歌：叮、叮、叮。我就搬个小板凳坐在门口听。","太阳好的时候，我把湿毛巾挂在阳台上。风一吹，它就在那儿摆来摆去，像在招手。"],"n":["小地方写出三样东西——花、雨声、毛巾；“喝了很多水”“像在招手”，都是孩子的话。","没有大风景可写，就写一个最小的角落，写满三件事。"]},{"t":"一棵大树","k":"写景","ps":["我家楼下有一棵大树，我抱不过来。","它的树皮上有很深的沟，一条一条，摸上去粗糙。树上有几个洞，我猜是小虫子的家。","夏天的时候，树下面很凉。奶奶搬了椅子坐那儿，我在旁边跳格子。太阳在树叶上面，我们在树叶的影子里。","有一片叶子掉在我头上，奶奶帮我拿下来，说：“大树在和你说悄悄话。”"],"n":["“我抱不过来”一句写了粗；“太阳在树叶上面，我们在树叶的影子里”，两句对照，凉意就出来了。","写一样东西的大小，就用身体去比一比。"]},{"t":"我自己","k":"写人","ps":["我叫小明，今年七岁，上二年级。","我的个子在班里不算高，坐在第三排。我有一双大眼睛，笑起来眼睛会变小。我最喜欢画画，画得最多的是恐龙。","我有一个毛病：写字的时候，写着写着，头就歪到左边去了。妈妈每次都帮我把头扶正。","我想当一个画恐龙的人，也想当一个能把自己照顾好的人。"],"n":["写自己敢写“毛病”，比只写优点可爱得多；两个“想当”，一个是梦想，一个是长大。","写自己，就写一个别人不知道的小习惯。"]}];

/* 学习统计 */
function mark(id,ok){
 if(!S.stat[id])S.stat[id]={r:0,w:0,t:0};
 const s=S.stat[id];
 if(ok)s.r++;else s.w++;
 s.t=Date.now();
 if(ok)S.right++;else S.wrong++;
 save();
}
function learned(kind){return Object.keys(S.stat).filter(k=>k[0]===kind).length}
function weakList(n){
 return Object.keys(S.stat).filter(k=>S.stat[k].w>0)
  .sort((a,b)=>S.stat[b].w-S.stat[a].w)
  .slice(0,n)
  .map(k=>({id:k,w:S.stat[k].w,t:itemText(k)}))
  .filter(x=>x.t);
}
function itemText(id){
 const m=/^([ws])(\d+)_(\d+)$/.exec(id);
 if(!m)return null;
 const ui=+m[2],j=+m[3];
 if(!U[ui])return null;
 if(m[1]==="w")return U[ui].w[j]?U[ui].w[j][0]:null;
 return U[ui].s[j]?U[ui].s[j].t:null;
}

/* ============================================================
   题目生成
   ============================================================ */
const wid=(i,j)=>"w"+i+"_"+j, sid=(i,j)=>"s"+i+"_"+j;

function qWord(ui,wj,kind){
 const w=U[ui].w[wj],id=wid(ui,wj);
 const ds=sh(U[ui].pool).slice(0,3);
 return kind==="mean"
  ?{t:"mean",id:id,p:w[0],a:w[1],o:sh([w[1],...ds.map(x=>WM[x])]),ex:w[2].replace("___",w[0])}
  :{t:"fill",id:id,p:w[2],a:w[0],o:sh([w[0],...ds]),ex:w[2].replace("___",w[0])};
}
function qOrder(ui,sj){
 const s=U[ui].s[sj];
 return {t:"order",id:sid(ui,sj),a:s.a,p:sh(s.a.map((_,k)=>k)),ex:s.t,tr:s.tr||"",
   alt:(s.alt||[]).map(o=>o.join(","))};
}
function qRhet(ui,sj){
 const s=U[ui].s[sj];
 let pool=RH.filter(x=>x!==s.k);
 if(s.k==="引用")pool=pool.filter(x=>x!=="比喻");
 const wrong=sh(pool).slice(0,3);
 return {t:"rhet",id:sid(ui,sj),p:s.t,a:s.k,o:sh([s.k,...wrong]),ex:s.t,tr:s.tr||""};
}
function qFromId(id,anyType){
 const m=/^([ws])(\d+)_(\d+)$/.exec(id);
 if(!m)return null;
 const ui=+m[2],j=+m[3];
 if(!U[ui])return null;
 if(m[1]==="w")return U[ui].w[j]?qWord(ui,j,anyType||(Math.random()<.5?"mean":"fill")):null;
 if(!U[ui].s[j])return null;
 return (U[ui].s[j].k&&Math.random()<.5)?qRhet(ui,j):qOrder(ui,j);
}
function buildLevel(i){
 const q=[];
 const ord=sh(U[i].w.map((_,j)=>j));
 ord.forEach((j,k)=>q.push(qWord(i,j,k%2?"fill":"mean")));
 U[i].s.forEach((s,j)=>q.push(qOrder(i,j)));
 U[i].s.forEach((s,j)=>{if(s.k)q.push(qRhet(i,j))});
 return sh(q);
}

function dueIds(n){
 const now=Date.now(),arr=[];
 Object.keys(S.stat).forEach(id=>{
  const s=S.stat[id];
  if(!s||!s.t)return;
  const days=(now-s.t)/864e5;
  if(s.w>0||days>=2){
   const score=s.w*3+Math.min(days,14)+(s.r?0:1.5);
   arr.push([score,id]);
  }
 });
 arr.sort((a,b)=>b[0]-a[0]);
 return arr.slice(0,n).map(x=>x[1]).filter(id=>itemText(id));

 h+=`</div>`;

 if(t===T_FAV){
  if(!S.fav.length){
   h+=`<div class=empty>还没有收藏的词句。<br>到各主题里点 ☆ 就能收藏，复习时随时来读。</div><button class=go style="margin:0 auto;display:block" onclick="goLib(${T_ALL})">去逛逛</button>`;
  }else{
   h+=`<p class=libh>我的收藏 · ${S.fav.length} 条</p>`;
   S.fav.forEach(id=>{
    const m=/^([ws])(\d+)_(\d+)$/.exec(id);if(!m)return;
    const ui=+m[2],j=+m[3];if(!U[ui])return;
    if(m[1]==="s"){if(U[ui].s[j])h+=sCard(ui,j)}
    else if(U[ui].w[j])h+=`<div class=sc><div class=st><b>${U[ui].w[j][0]}</b>　${U[ui].w[j][1]}</div>
     <div class=sa><span>${U[ui].n}</span><button class=ic onclick="favW(${ui},${j})" aria-label="取消收藏">⭐</button></div></div>`;
   });
  }
 }else if(t===T_MINE){
  if(!S.mine.length){
   h+=`<div class=empty>还没有你自己的句子。<br>每关通关后可以点「✍️ 仿写一句」，写下的句子都会收在这里。</div>`;
  }else{
   h+=`<p class=libh>我的句子 · ${S.mine.length} 句</p>`;
   S.mine.forEach((m,i)=>{
    h+=`<div class=sc><div class=st>${esc(m.t)}${m.tpl?`<div class=tr>句式：${m.tpl.replace(/___/g,"＿＿")}</div>`:""}</div><div class=sa>
     <span>${U[m.u]?U[m.u].n:"我的句子"}</span>
     <button class=ic onclick="sayM(${i})" aria-label="朗读">🔊</button>
     <button class=ic onclick="delM(${i})" aria-label="删除">🗑</button></div></div>`;
   });
  }
 }else if(t===T_ALL){
  h+=`<input class=search id=q type=search placeholder="搜索词句，例如：春天、比喻、坚持" autocomplete=off>
  <p class=libh>全部好句 · ${ALLS.length} 句</p>`;
  U.forEach((u,i)=>u.s.forEach((s,j)=>{h+=sCard(i,j)}));
  h+=`<p class=libh>全部好词 · ${U.reduce((a,u)=>a+u.w.length,0)} 个</p><div class=wlist>`;
  U.forEach((u,i)=>u.w.forEach((w,j)=>{h+=wRow(i,j)}));
  h+=`</div><div class=empty id=none style="display:none">没有找到相关词句，换个词试试？</div>`;
 }else if(t===T_QUOTE){
  h+=`<p class=libh>名言警句 · ${QUOTES.length} 条，写作时可以直接引用</p>`;
  QUOTES.forEach((q,i)=>{h+=`<div class=sc><div class=st>“${q[0]}”</div>
   <div class=sa><span>—— ${q[1]}</span><button class=ic onclick="sayQ(${i})" aria-label="朗读">🔊</button></div></div>`});
 }else{
  const ui=t-T_UNIT,u=U[ui];
  h+=`<p class=libh>${u.n} · ${u.s.length} 句好句，点 🔊 跟读，点 ☆ 收藏</p>`;
  h+=u.s.map((s,j)=>sCard(ui,j)).join("");
  h+=`<h3 class=gh>本关好词（${u.w.length}）</h3><div class=wlist>${u.w.map((w,j)=>wRow(ui,j)).join("")}</div>`;
  h+=`<div class=tip>💡 ${u.tip}</div>`;
  h+=`<button class=go style="display:block;margin:14px auto 0" onclick="goEditor(${ui})">✍️ 用这一关的词写一句</button>`;
 }
 r(h);
 if(same&&window.scrollTo)window.scrollTo(0,y);else if(window.scrollTo)window.scrollTo(0,0);
 const inp=$("#q");
 if(inp){
  inp.value=LQ;
  inp.oninput=()=>{LQ=inp.value;filterItems(LQ)};
  if(LQ)filterItems(LQ);
 }
 const on=$(".tabs .on");
 if(on&&on.parentElement){const bar=on.parentElement;bar.scrollLeft=on.offsetLeft-(bar.clientWidth-on.offsetWidth)/2}
}
function filterItems(v){
 const q=v.trim().toLowerCase();let n=0;
 document.querySelectorAll("[data-k]").forEach(el=>{
  const hit=!q||String(el.getAttribute("data-k")||"").toLowerCase().includes(q);
  el.style.display=hit?"":"none";
  if(hit)n++;
 });
 const none=$("#none");if(none)none.style.display=n?"none":"block";
}

/* ============================================================
   作文欣赏
   ============================================================ */
function essays(){
 ETAG="全部";
 essList();
}
function essaysTag(i){
 ETAG=ETAGS[i]||"全部";
 essList();
}
function essList(){
 if(window.scrollTo)window.scrollTo(0,0);
 const list=ESSAYS.map((e,i)=>({e:e,i:i})).filter(x=>ETAG==="全部"||x.e.k===ETAG);
 let h=`<div class=top><button class=x onclick="goHome()" aria-label="返回">✕</button><b class=tt>📖 作文欣赏</b><span class=stat>${ESSAYS.length} 篇</span></div>
 <p class=libh>一二年级范文。先读，再挑一句最喜欢的抄下来。</p>
 <div class=tabs>${ETAGS.map((t,i)=>`<button class="${ETAG===t?"on":""}" onclick="essaysTag(${i})">${t}</button>`).join("")}</div>`;
 if(!list.length)h+=`<div class=empty>这一类还没有范文。</div>`;
 list.forEach(x=>{
  const len=x.e.ps.join("").length;
  h+=`<button class=ecard onclick="goEssay(${x.i})">
   <span class=en>${String(x.i+1).padStart(2,"0")}</span>
   <span class=et><b>${x.e.t}</b><small>${x.e.k} · ${x.e.ps.length} 段 · 约 ${len} 字</small></span>
   <span class=ea>›</span></button>`;
 });
 h+=`<div class=tip>💡 读一篇，只做一件事：找出一句你最想抄下来的句子。</div>`;
 r(h);
}
function essay(i){
 if(i<0||i>=ESSAYS.length)return;
 if(window.scrollTo)window.scrollTo(0,0);
 const e=ESSAYS[i],last=i===ESSAYS.length-1,first=i===0;
 r(`<div class=top><button class=x onclick="goBack()" aria-label="返回列表">‹</button><b class=tt>${e.t}</b><span class=stat>${i+1}/${ESSAYS.length}</span></div>
 <div class=dtag>${e.k}</div>
 <div class=essay>${e.ps.map(p=>"<p>"+p+"</p>").join("")}</div>
 <div class=note><b>好在哪</b><p>${e.n[0]}</p><b>学一招</b><p>${e.n[1]}</p></div>
 <p class=libh>读完后，挑一句你最喜欢的，抄进本子里。</p>
 <button class=go id=rd style="display:block;margin:0 auto 10px">🔊 朗读全文</button>
 <div class=btnrow>
  <button class=mini ${first?"disabled":""} onclick="essay(${i-1})">‹ 上一篇</button>
  <button class=mini ${last?"disabled":""} onclick="essay(${i+1})">下一篇 ›</button>
 </div>`);
 const b=$("#rd");if(b)b.onclick=()=>speakText(e.ps.join(""));
}

/* ============================================================
   学习报告 / 备份
   ============================================================ */
function report(){
 if(window.scrollTo)window.scrollTo(0,0);
 const doneN=S.done.filter(i=>i<U.length).length;
 const starN=Object.keys(S.stars).reduce((a,k)=>a+(S.stars[k]||0),0);
 const ans=S.right+S.wrong,acc=ans?Math.round(100*S.right/ans):0;
 const weak=weakList(5);
 let h=`<div class=top><button class=x onclick="goHome()" aria-label="返回">✕</button><b class=tt>📊 学习报告</b><span class=stat>${new Date().toLocaleDateString("zh-CN")}</span></div>
 <div class=kpis>
  <div class=kpi><b>${doneN}/${U.length}</b><span>已通关关卡</span></div>
  <div class=kpi><b>${starN}</b><span>获得星星（满分 ${U.length*3}）</span></div>
  <div class=kpi><b>${acc}%</b><span>累计正确率（${ans} 次作答）</span></div>
  <div class=kpi><b>${S.streak}</b><span>连续学习天数</span></div>
 </div>
 <div class=kpis style="grid-template-columns:1fr 1fr">
  <div class=kpi><b>${learned("w")}</b><span>已练好词（共 ${U.reduce((a,u)=>a+u.w.length,0)}）</span></div>
  <div class=kpi><b>${learned("s")}</b><span>已练好句（共 ${ALLS.length}）</span></div>
 </div>`;
 h+=`<h3 class=gh>薄弱词句 Top 5</h3>`;
 if(!weak.length)h+=`<p class=libh>还没有错题记录。继续闯关，系统会把错得多的词句记在这里。</p>`;
 else{
  h+=`<div class=sc>${weak.map(x=>`<div class=weak><span>${x.t}</span><i>错 ${x.w} 次</i></div>`).join("")}</div>
  <button class=go style="display:block;margin:0 auto 6px" onclick="goReview(true)">只练这 ${weak.length} 题</button>`;
 }
 h+=`<h3 class=gh>我的句子</h3><p class=libh>已写 ${S.mine.length} 句。仿写是把“看懂”变成“会写”的关键一步。</p>
 <div class=btnrow><button class=mini onclick="goLib(${T_MINE})">查看我的句子</button><button class=mini onclick="goWrite()">继续写一句</button></div>
 <h3 class=gh>数据备份</h3><p class=libh>换设备或清理浏览器前，导出一份备份；导入会覆盖当前进度。</p>
 <div class=btnrow>
  <button class=mini onclick="exportData()">⬇️ 导出备份</button>
  <button class=mini onclick="importPick()">⬆️ 导入备份</button>
  <button class=mini onclick="resetAll()" style="color:var(--r)">清空进度</button>
 </div>
 <input id=imp type=file accept="application/json,.json" style="display:none">
 <p class=foot>数据只保存在这台设备的浏览器里，不会上传。<br>作文通 · 词句闯关 v5.1 · 可安装/离线</p>`;
 r(h);
 const imp=$("#imp");
 if(imp)imp.onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
   try{
    const o=JSON.parse(rd.result);
    if(!o||typeof o!=="object"||!Array.isArray(o.done))throw new Error("bad");
    if(!confirm("导入会覆盖当前进度，确定吗？"))return;
    S=Object.assign(fresh(),o);save();report();
   }catch(err){alert("文件格式不对，请选择从本应用导出的备份文件。")}
  };
  rd.readAsText(f);
 };
}
function exportData(){
 try{
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="作文通进度_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
 }catch(e){alert("当前浏览器不支持导出，可以试试系统分享或截图保存。")}
}
function importPick(){const el=document.getElementById("imp");if(el)el.click()}
function resetAll(){
 if(!confirm("确定清空所有进度？包括关卡、星星、收藏和我的句子。此操作无法撤销。"))return;
 S=fresh();save();goHome();
}

/* 启动：注册 Service Worker（仅 https 生效，本地 file:// 自动跳过） */
if("serviceWorker" in navigator&&location.protocol==="https:"){
 window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
home();
</script>
</body></html>
