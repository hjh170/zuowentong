<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.wrow span{color:var(--mut);flex:1;min-width:0}
.wrow .ic{font-size:17px;padding:8px;min-width:40px;min-height:40px}
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:15px;color:var(--fg);margin-bottom:12px}

.warn{color:var(--r);font-size:13px;min-height:18px;margin:2px 0 8px}

</head>

function mark(id,ok){

function itemText(id){
 const m=/^([ws])(\d+)_(\d+)$/.exec(id);
 if(!m)return null;
 const ui=+m[2],j=+m[3];
 if(!U[ui])return null;
 if(m[1]==="w")return U[ui].w[j]?U[ui].w[j][0]:null;
 return U[ui].s[j]?U[ui].s[j].t:null;
}

/* ============================================================
   题目生成
   ============================================================ */
const wid=(i,j)=>"w"+i+"_"+j, sid=(i,j)=>"s"+i+"_"+j;

function qWord(ui,wj,kind){
 const w=U[ui].w[wj],id=wid(ui,wj);
 const ds=sh(U[ui].pool).slice(0,3);
 return kind==="mean"
  ?{t:"mean",id:id,p:w[0],a:w[1],o:sh([w[1],...ds.map(x=>WM[x])]),ex:w[2].replace("___",w[0])}
  :{t:"fill",id:id,p:w[2],a:w[0],o:sh([w[0],...ds]),ex:w[2].replace("___",w[0])};
}
function qOrder(ui,sj){
 const s=U[ui].s[sj];
 return {t:"order",id:sid(ui,sj),a:s.a,p:sh(s.a.map((_,k)=>k)),ex:s.t,tr:s.tr||"",
   alt:(s.alt||[]).map(o=>o.join(","))};
}
function qRhet(ui,sj){
 const s=U[ui].s[sj];
 let pool=RH.filter(x=>x!==s.k);
 if(s.k==="引用")pool=pool.filter(x=>x!=="比喻");
 const wrong=sh(pool).slice(0,3);
 return {t:"rhet",id:sid(ui,sj),p:s.t,a:s.k,o:sh([s.k,...wrong]),ex:s.t,tr:s.tr||""};
}
function qFromId(id,anyType){
 const m=/^([ws])(\d+)_(\d+)$/.exec(id);
 if(!m)return null;
 const ui=+m[2],j=+m[3];
 if(!U[ui])return null;
 if(m[1]==="w")return U[ui].w[j]?qWord(ui,j,anyType||(Math.random()<.5?"mean":"fill")):null;
 if(!U[ui].s[j])return null;
 return (U[ui].s[j].k&&Math.random()<.5)?qRhet(ui,j):qOrder(ui,j);
}
function buildLevel(i){
 const q=[];
 const ord=sh(U[i].w.map((_,j)=>j));
 ord.forEach((j,k)=>q.push(qWord(i,j,k%2?"fill":"mean")));
 U[i].s.forEach((s,j)=>q.push(qOrder(i,j)));
 U[i].s.forEach((s,j)=>{if(s.k)q.push(qRhet(i,j))});
 return sh(q);
}

function dueIds(n){
 const now=Date.now(),arr=[];
 Object.keys(S.stat).forEach(id=>{
  const s=S.stat[id];
  if(!s||!s.t)return;
  const days=(now-s.t)/864e5;
  if(s.w>0||days>=2){
   const score=s.w*3+Math.min(days,14)+(s.r?0:1.5);
   arr.push([score,id]);
  }
 });
 arr.sort((a,b)=>b[0]-a[0]);
 return arr.slice(0,n).map(x=>x[1]).filter(id=>itemText(id));
}

}
function show(){

}
function pick(k){if(L.chk)return;L.sel=k;document.querySelectorAll(".opt").forEach((e,j)=>e.classList.toggle("on",j==k));$("#chk").disabled=false}
function chips(){
 const q=L.q[L.i],c=i=>`<button class=chip onclick="tog(${i})">${q.a[i]}</button>`;
 $("#ans").innerHTML=L.sel.map(c).join("");
 $("#pool").innerHTML=q.p.filter(i=>!L.sel.includes(i)).map(c).join("");
 $("#chk").disabled=L.sel.length<q.a.length;
}
function tog(i){if(L.chk)return;const k=L.sel.indexOf(i);k<0?L.sel.push(i):L.sel.splice(k,1);chips()}
function sameOrder(q,sel){
 const s=sel.join(","),base=q.a.map((_,k)=>k).join(",");
 return s===base||(q.alt||[]).indexOf(s)>=0;
}
function check(){
 const q=L.q[L.i];
 const ok=q.t==="order"?sameOrder(q,L.sel):q.o[L.sel]===q.a;
 L.chk=1;snd(ok?"ok":"bad");
 if(ok){
  if(!q.okd){q.okd=1;L.ok++}
  mark(q.id,true);
 }else{
  L.hp--;
  mark(q.id,false);
  if(L.wrongIds.indexOf(q.id)<0)L.wrongIds.push(q.id);
  if(!L.q.slice(L.i+1).some(x=>x.id===q.id))L.q.push(q);
 }
 const f=$("#fb");f.className="fb "+(ok?"good":"bad");
 const ansTxt=q.t==="order"?"":`正确答案：<b>${q.a}</b><br>`;
 const rd=q.t==="rhet"?`<div class=rd>${RD[q.a]}</div>`:"";

 f.innerHTML=`<div class=msg role=status><b>${ok?"答对了！👏":"再想想"}</b> <button class=sp onclick="speak()" aria-label="朗读">🔊</button>
  <div>${ok?"":ansTxt}${q.ex}</div>${rd}${tr}</div><button class=go onclick="next()">继续</button>`;
}

function next(){L.i++;if(L.hp<=0)return fail();L.i>=L.q.length?finish():show()}
function fail(){

  r(`<div class=end><div class=big>💔</div><h2>这组复习先到这里</h2>

 }else{
  const u=U[L.u],wrongN=(L.wrongIds||[]).length;
  stars=L.retry?1:(wrongN===0?3:wrongN<=2?2:1);
  if(!S.done.includes(L.u))S.done.push(L.u);
  S.stars[L.u]=Math.max(stars,S.stars[L.u]||0);
  stars=S.stars[L.u];
  title=(L.retry?"错题补完啦 💪":u.n+" 通关！");
  if(L.retry)extra=`<p class=sub style="margin:6px 0">把错题都弄懂了，本关正式通过。</p>`;
 }
 S.xp+=g;
 const t=new Date(),y=new Date(t-864e5);
 S.streak=S.last===t.toDateString()?S.streak:(S.last===y.toDateString()?S.streak+1:1);
 S.last=t.toDateString();
 save();snd("win");
 const allDone=S.done.filter(i=>i<U.length).length>=U.length;

 if(L.review){
  r(`<div class=end><div class=big>✅</div><h2>${title}</h2>
   <p class=sub style="margin:6px 0">获得 ⭐${g} 经验　🔥连续 ${S.streak} 天</p>${extra}
   <button class=go onclick="review(false)">再来一组</button>
   <button class=ghost onclick="home()">返回首页</button></div>`);
  return;
 }
 const u=U[L.u];
 r(`<div class=end><div class=big>${allDone?"🏆":"🎉"}</div><h2>${allDone?"全部通关！":title}</h2>
 <div class=stars>${starStr(stars)}</div>
 <p class=sub style="margin:2px 0">获得 ⭐${g} 经验　🔥连续 ${S.streak} 天${allDone?"　共 "+U.length+" 关":""}</p>
 ${allDone?"<p class=sub>十五个主题全部学完，去好句宝库挑几句，写进你的作文里吧。</p>":"<div class=tip>💡 "+u.tip+"</div>"}
 <div class=wl><div class=wh>本关好词</div>${u.w.map(w=>`<div><b>${w[0]}</b>　${w[1]}</div>`).join("")}
 <div class=wh style="margin-top:10px">本关好句</div>${u.s.map(s=>`<div>${s.t}${s.k?`　<span class=tag>${s.k}</span>`:""}</div>`).join("")}</div>
 <button class="go alt" onclick="editor(${L.u})">✍️ 仿写一句</button>
 ${L.u+1<U.length?`<button class=go onclick="start(${L.u+1})">进入下一关</button>`:""}
 <button class=ghost onclick="home()">返回目录</button></div>`);
}

/* ============================================================
   仿写（我的句子）
   ============================================================ */
function editor(ui){
 EDU=ui;const u=U[ui];
 r(`<div class=top><button class=x onclick="home()" aria-label="返回">✕</button><b class=tt>✍️ 仿写一句</b><span class=stat>${S.mine.length} 句</span></div>
 <div class=tip>${u.n} · 参考句式<br><b>${u.tpl.replace(/___/g,"＿＿")}</b></div>
 <textarea id=ta class=ta placeholder="把横线换成你自己的内容，也可以完全自由发挥。先写下来，不用怕写不好。"></textarea>
 <div class=row><span id=cnt>0 字</span><span>至少 6 个字</span></div>
 <div class=warn id=warn></div>
 <button class=go id=sv>保存到「我的句子」</button>
 <button class=ghost onclick="home()">返回首页</button>`);
 const ta=$("#ta");
 ta.oninput=()=>{$("#cnt").textContent=ta.value.length+" 字"};
 $("#sv").onclick=()=>{
  const v=ta.value.trim();
  if(v.length<6){$("#warn").textContent="再多写几个字吧，至少 6 个字～";return}
  S.mine.unshift({t:v,u:EDU,ts:Date.now()});
  if(S.mine.length>300)S.mine.length=300;
  save();snd("ok");
  r(`<div class=end><div class=big>🌟</div><h2>已收进「我的句子」</h2>
   <div class=wl>${esc(v)}</div>
   <p class=sub>好句子是写出来的，不是背出来的。</p>
   <button class=go onclick="editor(${EDU})">再写一句</button>
   <button class=ghost onclick="home()">返回首页</button></div>`);
 };
 ta.focus();
}

/* ============================================================
   好句宝库
   ============================================================ */
function tabBtn(i,label,cur){return `<button class="${cur===i?"on":""}" onclick="lib(${i})">${label}</button>`}
function sCard(ui,sj){
 const s=U[ui].s[sj],id=sid(ui,sj),on=S.fav.indexOf(id)>=0;
 return `<div class=sc data-k="${esc(s.t+" "+U[ui].n+" "+(s.k||""))}">
  <div class=st>${s.t}${s.tr?`<div class=tr>${s.tr}</div>`:""}</div>
  <div class=sa>${s.k?`<span class=tag>${s.k}</span>`:""}<span>${U[ui].n}</span>
  <button class=ic onclick="sayS(${ui},${sj})" aria-label="朗读">🔊</button>
  <button class=ic onclick="favS(${ui},${sj})" aria-label="收藏">${on?"⭐":"☆"}</button></div></div>`;
}
function wRow(ui,wj){
 const w=U[ui].w[wj],id=wid(ui,wj),on=S.fav.indexOf(id)>=0;
 return `<div class=wrow data-k="${esc(w[0]+" "+w[1])}"><b>${w[0]}</b><span>${w[1]}</span>
  <button class=ic onclick="favW(${ui},${wj})" aria-label="收藏">${on?"⭐":"☆"}</button></div>`;
}
function sayS(i,j){speakText(U[i].s[j].t)}
function sayQ(i){speakText(QUOTES[i][0])}
function sayM(i){if(S.mine[i])speakText(S.mine[i].t)}
function favS(i,j){
 const id=sid(i,j),k=S.fav.indexOf(id);
 k<0?S.fav.push(id):S.fav.splice(k,1);
 save();lib(LT);
}
function favW(i,j){
 const id=wid(i,j),k=S.fav.indexOf(id);
 k<0?S.fav.push(id):S.fav.splice(k,1);
 save();lib(LT);
}
function delM(i){
 if(!confirm("删除这句？"))return;
 S.mine.splice(i,1);save();lib(LT);
}
function lib(t){
 const same=(t===LT),y=(window.scrollY||0);
 LT=t;if(!same)LQ="";const n=U.length;
 let h=`<div class=top><button class=x onclick="home()" aria-label="返回">✕</button><b class=tt>📚 好句宝库</b><span class=stat>⭐${S.fav.length}</span></div><div class=tabs>`;
 h+=tabBtn(T_FAV,"⭐ 收藏 "+S.fav.length,t);
 h+=tabBtn(T_MINE,"✍️ 我的 "+S.mine.length,t);
 h+=tabBtn(T_ALL,"🔍 全部",t);
 U.forEach((u,i)=>{h+=tabBtn(T_UNIT+i,u.e+" "+u.n.replace("篇",""),t)});
 h+=tabBtn(T_QUOTE,"💬 名言",t);
 h+=`</div>`;

 if(t===T_FAV){
  if(!S.fav.length){
   h+=`<div class=empty>还没有收藏的词句。<br>到各主题里点 ☆ 就能收藏，复习时随时来读。</div><button class=go style="margin:0 auto;display:block" onclick="lib(${T_ALL})">去逛逛</button>`;
  }else{
   h+=`<p class=libh>我的收藏 · ${S.fav.length} 条</p>`;
   S.fav.forEach(id=>{
    const m=/^([ws])(\d+)_(\d+)$/.exec(id);if(!m)return;
    const ui=+m[2],j=+m[3];if(!U[ui])return;
    if(m[1]==="s"){if(U[ui].s[j])h+=sCard(ui,j)}
    else if(U[ui].w[j])h+=`<div class=sc><div class=st><b>${U[ui].w[j][0]}</b>　${U[ui].w[j][1]}</div>
     <div class=sa><span>${U[ui].n}</span><button class=ic onclick="favW(${ui},${j})" aria-label="取消收藏">⭐</button></div></div>`;
   });
  }
 }else if(t===T_MINE){
  if(!S.mine.length){
   h+=`<div class=empty>还没有你自己的句子。<br>每关通关后可以点「✍️ 仿写一句」，写下的句子都会收在这里。</div>`;
  }else{
   h+=`<p class=libh>我的句子 · ${S.mine.length} 句</p>`;
   S.mine.forEach((m,i)=>{
    h+=`<div class=sc><div class=st>${esc(m.t)}</div><div class=sa>
     <span>${U[m.u]?U[m.u].n:"我的句子"}</span>
     <button class=ic onclick="sayM(${i})" aria-label="朗读">🔊</button>
     <button class=ic onclick="delM(${i})" aria-label="删除">🗑</button></div></div>`;
   });
  }
 }else if(t===T_ALL){
  h+=`<input class=search id=q type=search placeholder="搜索词句，例如：春天、比喻、坚持" autocomplete=off>
  <p class=libh>全部好句 · ${ALLS.length} 句</p>`;
  U.forEach((u,i)=>u.s.forEach((s,j)=>{h+=sCard(i,j)}));
  h+=`<p class=libh>全部好词 · ${U.reduce((a,u)=>a+u.w.length,0)} 个</p><div class=wlist>`;
  U.forEach((u,i)=>u.w.forEach((w,j)=>{h+=wRow(i,j)}));
  h+=`</div><div class=empty id=none style="display:none">没有找到相关词句，换个词试试？</div>`;
 }else if(t===T_QUOTE){
  h+=`<p class=libh>名言警句 · ${QUOTES.length} 条，写作时可以直接引用</p>`;
  QUOTES.forEach((q,i)=>{h+=`<div class=sc><div class=st>“${q[0]}”</div>
   <div class=sa><span>—— ${q[1]}</span><button class=ic onclick="sayQ(${i})" aria-label="朗读">🔊</button></div></div>`});
 }else{
  const ui=t-T_UNIT,u=U[ui];
  h+=`<p class=libh>${u.n} · ${u.s.length} 句好句，点 🔊 跟读，点 ☆ 收藏</p>`;
  h+=u.s.map((s,j)=>sCard(ui,j)).join("");
  h+=`<h3 class=gh>本关好词（${u.w.length}）</h3><div class=wlist>${u.w.map((w,j)=>wRow(ui,j)).join("")}</div>`;
  h+=`<div class=tip>💡 ${u.tip}</div>`;
  h+=`<button class=go style="display:block;margin:14px auto 0" onclick="editor(${ui})">✍️ 用这一关的词写一句</button>`;
 }
 r(h);
 if(same&&window.scrollTo)window.scrollTo(0,y);else if(window.scrollTo)window.scrollTo(0,0);
 const inp=$("#q");
 if(inp){
  inp.value=LQ;
  inp.oninput=()=>{LQ=inp.value;filterItems(LQ)};
  if(LQ)filterItems(LQ);
 }
 const on=$(".tabs .on");
 if(on&&on.parentElement){const bar=on.parentElement;bar.scrollLeft=on.offsetLeft-(bar.clientWidth-on.offsetWidth)/2}
}
function filterItems(v){
 const q=v.trim().toLowerCase();let n=0;
 document.querySelectorAll("[data-k]").forEach(el=>{
  const hit=!q||String(el.getAttribute("data-k")||"").toLowerCase().includes(q);
  el.style.display=hit?"":"none";
  if(hit)n++;
 });
 const none=$("#none");if(none)none.style.display=n?"none":"block";
}

/* ============================================================
   学习报告 / 备份
   ============================================================ */
function report(){
 if(window.scrollTo)window.scrollTo(0,0);
 const doneN=S.done.filter(i=>i<U.length).length;
 const starN=Object.keys(S.stars).reduce((a,k)=>a+(S.stars[k]||0),0);
 const ans=S.right+S.wrong,acc=ans?Math.round(100*S.right/ans):0;
 const weak=weakList(5);
 let h=`<div class=top><button class=x onclick="home()" aria-label="返回">✕</button><b class=tt>📊 学习报告</b><span class=stat>${new Date().toLocaleDateString("zh-CN")}</span></div>
 <div class=kpis>
  <div class=kpi><b>${doneN}/${U.length}</b><span>已通关关卡</span></div>
  <div class=kpi><b>${starN}</b><span>获得星星（满分 ${U.length*3}）</span></div>
  <div class=kpi><b>${acc}%</b><span>累计正确率（${ans} 次作答）</span></div>
  <div class=kpi><b>${S.streak}</b><span>连续学习天数</span></div>
 </div>
 <div class=kpis style="grid-template-columns:1fr 1fr">
  <div class=kpi><b>${learned("w")}</b><span>已练好词（共 ${U.reduce((a,u)=>a+u.w.length,0)}）</span></div>
  <div class=kpi><b>${learned("s")}</b><span>已练好句（共 ${ALLS.length}）</span></div>
 </div>`;
 h+=`<h3 class=gh>薄弱词句 Top 5</h3>`;
 if(!weak.length)h+=`<p class=libh>还没有错题记录。继续闯关，系统会把错得多的词句记在这里。</p>`;
 else{
  h+=`<div class=sc>${weak.map(x=>`<div class=weak><span>${x.t}</span><i>错 ${x.w} 次</i></div>`).join("")}</div>
  <button class=go style="display:block;margin:0 auto 6px" onclick="review(true)">只练这 ${weak.length} 题</button>`;
 }
 h+=`<h3 class=gh>我的句子</h3><p class=libh>已写 ${S.mine.length} 句。仿写是把“看懂”变成“会写”的关键一步。</p>
 <div class=btnrow><button class=mini onclick="lib(${T_MINE})">查看我的句子</button><button class=mini onclick="editor(${EDU||0})">继续写一句</button></div>
 <h3 class=gh>数据备份</h3><p class=libh>换设备或清理浏览器前，导出一份备份；导入会覆盖当前进度。</p>
 <div class=btnrow>
  <button class=mini onclick="exportData()">⬇️ 导出备份</button>
  <button class=mini onclick="importPick()">⬆️ 导入备份</button>
  <button class=mini onclick="resetAll()" style="color:var(--r)">清空进度</button>
 </div>
 <input id=imp type=file accept="application/json,.json" style="display:none">
 <p class=foot>数据只保存在这台设备的浏览器里，不会上传。<br>作文通 · 词句闯关 v3</p>`;
 r(h);
 const imp=$("#imp");
 if(imp)imp.onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
   try{
    const o=JSON.parse(rd.result);
    if(!o||typeof o!=="object"||!Array.isArray(o.done))throw new Error("bad");
    if(!confirm("导入会覆盖当前进度，确定吗？"))return;
    S=Object.assign(fresh(),o);save();report();
   }catch(err){alert("文件格式不对，请选择从本应用导出的备份文件。")}
  };
  rd.readAsText(f);
 };
}
function exportData(){
 try{
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="作文通进度_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
 }catch(e){alert("当前浏览器不支持导出，可以试试系统分享或截图保存。")}
}
function importPick(){const el=document.getElementById("imp");if(el)el.click()}
function resetAll(){
 if(!confirm("确定清空所有进度？包括关卡、星星、收藏和我的句子。此操作无法撤销。"))return;
 S=fresh();save();home();
}

/* 启动 */
home();
</script>
</body></html>
